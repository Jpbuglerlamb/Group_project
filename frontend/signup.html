<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="icon" type="image/png" sizes="180x180" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <title>Signup</title>
</head>
<body>
    <header>
        <div class="clock">
            <a href="index.html" aria-label="Study Planner home">
                <!-- Logo redrawn as SVG: the time replaces "STUDY", the date replaces "Planner" -->
                <svg class="clock-logo" viewBox="0 0 400 400" role="img">
                    <g class="rays">
                        <line x1="200" y1="20" x2="200" y2="80" transform="rotate(0 200 200)" />
                        <line x1="200" y1="20" x2="200" y2="80" transform="rotate(30 200 200)" />
                        <line x1="200" y1="20" x2="200" y2="80" transform="rotate(60 200 200)" />
                        <line x1="200" y1="20" x2="200" y2="80" transform="rotate(90 200 200)" />
                        <line x1="200" y1="20" x2="200" y2="80" transform="rotate(120 200 200)" />
                        <line x1="200" y1="20" x2="200" y2="80" transform="rotate(150 200 200)" />
                        <line x1="200" y1="20" x2="200" y2="80" transform="rotate(180 200 200)" />
                        <line x1="200" y1="20" x2="200" y2="80" transform="rotate(210 200 200)" />
                        <line x1="200" y1="20" x2="200" y2="80" transform="rotate(240 200 200)" />
                        <line x1="200" y1="20" x2="200" y2="80" transform="rotate(270 200 200)" />
                        <line x1="200" y1="20" x2="200" y2="80" transform="rotate(300 200 200)" />
                        <line x1="200" y1="20" x2="200" y2="80" transform="rotate(330 200 200)" />
                    </g>
                    <text id="time" x="200" y="210" text-anchor="middle">16:48</text>
                    <text id="date" x="200" y="250" text-anchor="middle">Wednesday, 23 September</text>
                </svg>
            </a>
        </div>
        <div class="site-title">
            <h2>Study Planner</h2>
            <p class="made-by">
                Powered by
                <img src="images/DA-logo.png" alt="Dundee and Angus College">
            </p>
        </div>
        <a href="login.html">
            <button>Login/Signup</button>
        </a>
    </header>
    <nav class="main-nav">
        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="resources.html">Resources</a>
    </nav>
    <main>
        <form id="signup-form" method="POST">
            <!-- Username -->
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Username" required>
            <!-- Name -->
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" placeholder="Full Name" required>
            <!-- Phone number -->
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="Phone Number" required>
            <!-- Email -->
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Email" required>
            <!-- Password -->
            <label for="password">Create Password</label>
            <input type="password" id="password" name="password" required>
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password" required>
            <!-- Submit -->
            <p id="signup-message"></p>
            <button type="submit">Submit</button>
        </form>
    </main>
    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-brand">
                <h3>Study Planner</h3>
                <p>Keep track of your classes and assessments.</p>
            </div>
            <div class="footer-links">
                <h4>Links</h4>
                <a href="home.html">Home</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
        </div>
        <div class="footer-bottom">
            &copy; 2026 Study Planner
        </div>
    </footer>
    <script src="js/clock.js"></script>
    <script src="js/signup.js"></script>
</body>
</html>
