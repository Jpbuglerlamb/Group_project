<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/calendar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>My Planner</title>
</head>
<body>
    <header>
        <div class="clock">
            <a href="index.html" aria-label="Study Planner home">
                <!-- Logo redrawn as SVG: the time replaces "STUDY", the date replaces "Planner" -->
                <svg class="clock-logo" viewBox="0 0 400 400" role="img">
                    <g class="rays">
                        <line x1="200" y1="20" x2="200" y2="80" transform="rotate(0 200 200)" />
                        <line x1="200" y1="20" x2="200" y2="80" transform="rotate(30 200 200)" />
                        <line x1="200" y1="20" x2="200" y2="80" transform="rotate(60 200 200)" />
                        <line x1="200" y1="20" x2="200" y2="80" transform="rotate(90 200 200)" />
                        <line x1="200" y1="20" x2="200" y2="80" transform="rotate(120 200 200)" />
                        <line x1="200" y1="20" x2="200" y2="80" transform="rotate(150 200 200)" />
                        <line x1="200" y1="20" x2="200" y2="80" transform="rotate(180 200 200)" />
                        <line x1="200" y1="20" x2="200" y2="80" transform="rotate(210 200 200)" />
                        <line x1="200" y1="20" x2="200" y2="80" transform="rotate(240 200 200)" />
                        <line x1="200" y1="20" x2="200" y2="80" transform="rotate(270 200 200)" />
                        <line x1="200" y1="20" x2="200" y2="80" transform="rotate(300 200 200)" />
                        <line x1="200" y1="20" x2="200" y2="80" transform="rotate(330 200 200)" />
                    </g>
                    <text id="time" x="200" y="210" text-anchor="middle">16:48</text>
                    <text id="date" x="200" y="250" text-anchor="middle">Wednesday, 23 September</text>
                </svg>
            </a>
        </div>
        <div class="site-title">
            <h2>Study Planner</h2>
            <p class="made-by">
                Powered by
                <img src="images/DA-logo.png" alt="Dundee and Angus College">
            </p>
        </div>
        <div class="user-area">
            <span id="username-display"></span>
            <button id="logout-button">Log out</button>
        </div>
    </header>
    <nav class="main-nav">
        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="resources.html">Resources</a>
        <a href="calendar.html">Calendar</a>
    </nav>
    <main>
        <div class="container">
            <div class="semester">
                <h2>Semester</h2>
                <button id="semester1">semester 1</button>
                <button id="semester2">semester 2</button>
            </div>
            <div class="classes">
                <h2>Classes</h2>
                <div class="class-list">
                </div>
                <form id="add-class-form" class="add-form">
                    <h3>Add class</h3>
                    <label for="class-name">Class name</label>
                    <input type="text" id="class-name" name="name" required>
                    <p class="form-message" id="class-message"></p>
                    <button type="submit">Add</button>
                </form>
            </div>
            <div class="assessment-card">
                <div class="assessments">
                    <h2>Assessment</h2>
                    <div class="assessment-list">
                    </div>
                    <form id="add-assessment-form" class="add-form">
                        <h3>Add Assessment</h3>
                        <label for="assessment-title">Title</label>
                        <input type="text" id="assessment-title" name="title" required>
                        <label for="assessment-due">Due Date</label>
                        <input type="date" id="assessment-due" name="due_date" required>
                        <p class="form-message" id="assessment-message"></p>
                        <button type="submit">Add</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="calendar-container">
            <div class="left">
                <div class="calendar">
                    <div class="month">
                        <i class="fa fa-angle-left prev"></i>
                        <div class="date"></div>
                        <i class="fa fa-angle-right next"></i>
                    </div>
                    <div class="weekdays">
                        <div>sun</div>
                        <div>mon</div>
                        <div>tue</div>
                        <div>wed</div>
                        <div>thu</div>
                        <div>fri</div>
                        <div>sat</div>
                    </div>
                    <div class="days">
                        <!-- days in js -->
                    </div>
                    <div class="goto-today">
                        <div class="goto">
                            <input type="text" placeholder="mm/yyyy" class="date-input">
                            <button class="goto-btn">go</button>
                        </div>
                        <button class="today-btn">today</button>
                    </div>
                </div>
            </div>

            <div class="right">
                <div class="today-date">
                    <div class="event-day"></div>
                    <div class="event-date"></div>
                </div>
                <div class="events">

                </div>
                <div class="add-event-wrapper">
                    <div class="add-event-title">Add Assignment</div>
                    <div class="add-event-input">
                        <input type="text" placeholder="Assignment Title" class="assignment-title" />
                    </div>
                    <button class="add-event-btn">Add</button>
                </div>
            </div>
        </div>
    </main>
    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-brand">
                <h3>Study Planner</h3>
                <p>Keep track of your classes and assessments.</p>
            </div>
            <div class="footer-links">
                <h4>Links</h4>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="calendar.html">Calendar</a>
            </div>
        </div>
        <div class="footer-bottom">
            &copy; 2026 Study Planner
        </div>
    </footer>
    <script src="js/clock.js"></script>
    <script src="js/api.js"></script>
    <script src="js/script.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/calendar.js"></script>
</body>
</html>
